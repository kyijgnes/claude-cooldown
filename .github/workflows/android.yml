# 릴리스 만들기 — 폰 APK + 윈도우 exe
#
# 태그를 밀면(v0.2 처럼) APK 와 exe 를 만들어 **둘 다** 릴리스에 붙인다.
# ★ **exe 를 빠뜨리지 않는다.** 예전에는 exe 를 손으로 올려서 v0.14 처럼 APK 만 달린
#   릴리스가 나왔다. 손으로 하지 말 것 — 이 워크플로가 늘 같이 올린다.
# 손으로 돌리려면 Actions 탭 > 이 워크플로 > Run workflow.
#
# ★ 시크릿 두 개가 있어야 돈다 — COOLDOWN_KEYSTORE_B64 / COOLDOWN_KEYSTORE_PASSWORD.
#   없으면 디버그 키로 서명돼 **빌드마다 서명이 달라지고 폰이 업데이트를 거부한다.**
#   그래서 조용히 넘어가지 않고 아래 '서명 키 확인' 에서 멈춘다.
name: android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 서명 키 확인
        env:
          B64: ${{ secrets.COOLDOWN_KEYSTORE_B64 }}
          PW: ${{ secrets.COOLDOWN_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$B64" ] || [ -z "$PW" ]; then
            echo "::error::서명 키 시크릿이 없다 (COOLDOWN_KEYSTORE_B64 / COOLDOWN_KEYSTORE_PASSWORD)."
            echo "::error::이대로 만들면 서명이 매번 달라져 친구가 업데이트를 못 받는다. CLAUDE.md '나눠주기' 참고."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드
        working-directory: android
        env:
          COOLDOWN_KEYSTORE_B64: ${{ secrets.COOLDOWN_KEYSTORE_B64 }}
          COOLDOWN_KEYSTORE_PASSWORD: ${{ secrets.COOLDOWN_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease --console=plain

      - name: 이름 붙이기
        id: apk
        run: |
          src=android/app/build/outputs/apk/release/app-release.apk
          # ★ 이름은 ASCII 로. 한글로 지으면 GitHub 이 릴리스 자산 이름에서 통째로 깎아내
          #   '-v0.3.apk' 같은 게 붙는다 (v0.3 에서 실제로 그랬다).
          out="claude-cooldown-${GITHUB_REF_NAME:-dev}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # 서명이 정말 그 키인지 로그에 남긴다 — 지문이 매번 같아야 한다.
      - name: 서명 지문 남기기
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$signer" verify --print-certs "${{ steps.apk.outputs.path }}"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}

      - name: 릴리스에 붙이기
        # ★ **릴리스 노트(본문)를 쓰지 않는다.** 제목(태그)과 받을 파일만 둔다 —
        #   받는 사람이 볼 것은 파일이지 변경 설명이 아니다.
        #   body / body_path 를 넣지 말 것, generate_release_notes 도 켜지 말 것(자동 생성도 노트다).
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
          body: ""

  # 윈도우 위젯 exe. APK 가 릴리스를 먼저 만들고 나서 붙인다(둘이 같이 만들면 겹친다).
  exe:
    runs-on: windows-latest
    needs: apk
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 준비물
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt pyinstaller

      - name: 빌드
        run: python build_exe.py
        working-directory: pc

      # 판 번호는 gradle 의 versionName 을 따르므로 태그와 어긋날 수 있다 — 여기서 잡는다.
      - name: 판 번호가 태그와 같은지
        shell: bash
        run: |
          want="pc/dist/claude-cooldown-${GITHUB_REF_NAME}.exe"
          if [ ! -f "$want" ]; then
            echo "::error::$want 가 없다. build.gradle.kts 의 versionName 과 태그가 어긋났다."
            ls -1 pc/dist || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: pc/dist/claude-cooldown-${{ github.ref_name }}.exe

      - name: 릴리스에 붙이기
        # ★ 여기도 릴리스 노트를 쓰지 않는다 (위 '릴리스에 붙이기' 와 같은 규칙).
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pc/dist/claude-cooldown-${{ github.ref_name }}.exe
          generate_release_notes: false
          body: ""
